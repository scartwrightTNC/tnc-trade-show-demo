<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="description" content="TNC Trade Show Demo - Interactive showcase of our solutions">
    <meta name="theme-color" content="#0a2540">
    <title>Packed Planet - Trade Show Demo</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="vendor/simple-keyboard/simple-keyboard.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/attract.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Vercel Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <!-- Attraction Screen Layer -->
    <div id="attractLayer" class="attract-layer">
        <div class="attract-background">
            <video class="attract-video" autoplay muted loop playsinline
                   poster="assets/images/attract-poster.jpg">
                <source src="assets/video/attract-loop.mp4" type="video/mp4">
            </video>
            <div class="attract-gradient"></div>
            <div class="attract-particles"></div>
        </div>
        
        <div class="attract-content">
            <div class="attract-logo">
                <img src="assets/images/packed-planet-logo.png" alt="Packed Planet" class="logo-img">
                <div class="logo-glow"></div>
            </div>
            
            <div class="attract-message-container">
                <div class="attract-welcome">Welcome to</div>
                <div class="attract-tagline" id="attractTagline">The Future of Self-Storage Management</div>
            </div>
            
            <div class="attract-features">
                <div class="feature-badge" data-category="enterprise">
                    <i class="fas fa-building"></i>
                    <span>Enterprise</span>
                </div>
                <div class="feature-badge" data-category="customer-xp">
                    <i class="fas fa-users"></i>
                    <span>Customer XP</span>
                </div>
                <div class="feature-badge" data-item="revenue-pro">
                    <i class="fas fa-chart-line"></i>
                    <span>Revenue Pro</span>
                </div>
                <div class="feature-badge" data-item="noaweb">
                    <i class="fas fa-globe"></i>
                    <span>NOAWEB</span>
                </div>
                <div class="feature-badge" data-category="management">
                    <i class="fas fa-cogs"></i>
                    <span>Management</span>
                </div>
            </div>
            
            <div class="attract-hint">
                <div class="hint-icon">
                    <i class="fas fa-hand-pointer"></i>
                </div>
                <div class="hint-text">Touch to Begin</div>
            </div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app" class="app-container" style="display: none;">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <img src="assets/images/packed-planet-logo.png" alt="Packed Planet" class="header-logo">
                <h1 class="header-title">Packed Planet Demo</h1>
                <button id="attractBtn" class="attract-btn" title="Return to Attraction Screen">
                    <i class="fas fa-tv"></i>
                </button>
            </div>
        </header>

        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb" id="breadcrumb">
            <button class="breadcrumb-item" data-level="0">
                <i class="fas fa-home"></i> Home
            </button>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content" id="mainContent">
            <!-- Categories will be dynamically loaded here -->
        </main>

        <!-- Demo Detail Modal -->
        <div id="demoModal" class="demo-modal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <button class="modal-close" id="modalClose">
                    <i class="fas fa-times"></i>
                </button>
                <div class="modal-body" id="modalBody">
                    <!-- Demo details loaded here -->
                </div>
            </div>
        </div>

        <!-- Offline Indicator -->
        <div id="offlineIndicator" class="offline-indicator" style="display: none;">
            <i class="fas fa-wifi-slash"></i>
            <span>Offline Mode</span>
        </div>

        <!-- QR Code Modal -->
        <div id="qrModal" class="qr-modal">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <button class="modal-close" id="qrClose">
                    <i class="fas fa-times"></i>
                </button>
                <div class="modal-body">
                    <h2>Scan to View on Mobile</h2>
                    <div id="qrCode"></div>
                    <p class="qr-url" id="qrUrl"></p>
                </div>
            </div>
        </div>

        <!-- Fullscreen Slides Viewer -->
        <div id="slidesModal" class="slides-modal">
            <div class="modal-overlay"></div>
            <button class="modal-close" id="slidesModalClose">
                <i class="fas fa-times"></i>
            </button>
            <iframe id="slidesFrame" class="slides-frame" title="Presentation" allowfullscreen></iframe>
        </div>

        <!-- Lead Capture FAB -->
        <button id="leadFab" class="lead-fab" title="Get More Info">
            <i class="fas fa-envelope"></i>
            <span>Get Info</span>
        </button>

        <!-- Lead Capture Modal -->
        <div id="leadModal" class="lead-modal">
            <div class="modal-overlay"></div>
            <div class="modal-content lead-modal-content">
                <button class="modal-close" id="leadModalClose">
                    <i class="fas fa-times"></i>
                </button>
                <div class="modal-body">
                    <div class="lead-header">
                        <div class="lead-icon">
                            <i class="fas fa-paper-plane"></i>
                        </div>
                        <div>
                            <div class="lead-title">Get Product Info</div>
                            <div class="lead-subtitle">We'll send you a link with more details</div>
                        </div>
                    </div>
                    <form id="leadForm" class="lead-form">
                        <label class="lead-label" for="leadProduct">Product</label>
                        <select id="leadProduct" class="lead-select"></select>

                        <label class="lead-label" for="leadFirstName">Your Name</label>
                        <div class="lead-name-row">
                            <input id="leadFirstName" class="lead-input" type="text"
                                   autocomplete="given-name" inputmode="none" placeholder="First name">
                            <input id="leadLastName" class="lead-input" type="text"
                                   autocomplete="family-name" inputmode="none" placeholder="Last name">
                        </div>

                        <label class="lead-label" for="leadContact">Email or Mobile Number</label>
                        <input id="leadContact" class="lead-input" type="text"
                               autocomplete="email" inputmode="none"
                               placeholder="you@example.com or 757-555-1234">

                        <!-- Honeypot: hidden from humans, bots fill it -->
                        <input id="leadWebsite" type="text" tabindex="-1" autocomplete="off"
                               class="lead-honeypot" aria-hidden="true">

                        <div id="leadStatus" class="lead-status"></div>

                        <button type="submit" id="leadSubmit" class="lead-submit">
                            <i class="fas fa-paper-plane"></i> Send Info
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- On-screen keyboard — rendered outside the modal, docked at the
         bottom of the viewport while the lead form is open. -->
    <div class="lead-kb simple-keyboard"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="vendor/simple-keyboard/simple-keyboard.min.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/attract-mode.js"></script>
    <script src="js/menu-system.js"></script>
    <script src="js/demo-launcher.js"></script>
    <script src="js/lead-capture.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
